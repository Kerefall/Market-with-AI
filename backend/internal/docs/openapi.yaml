openapi: 3.0.3
info:
  title: ShopAI API
  version: 0.2.0
  description: |
    Backend платформы интернет-магазинов с ИИ-помощником.
    Покупатели работают без аккаунта (контакты хранятся в заказе). Роли: seller, admin.
    Авторизация: `Authorization: Bearer <token>` (токен выдаёт POST /api/auth/login).
    Демо-логины: seller `garden@shop.test` / `seller12345`, admin `admin@shop.test` / `admin12345`.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Shop
  - name: Seller products
  - name: Seller orders
  - name: AI
  - name: Catalog
  - name: Orders (buyer)
  - name: Admin
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest: { description: Некорректные данные, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Нет или неверный токен, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Недостаточно прав, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Не найдено, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Конфликт состояния, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    Number: { name: number, in: path, required: true, schema: { type: string }, example: ORD-DEMO-0001 }
    Limit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0 } }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, enum: [seller, admin] }
        created_at: { type: string, format: date-time }
    Shop:
      type: object
      properties:
        id: { type: integer }
        owner_id: { type: integer }
        name: { type: string }
        logo_url: { type: string }
        description: { type: string }
        contacts: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        created_at: { type: string, format: date-time }
    ShopInput:
      type: object
      properties:
        name: { type: string }
        logo_url: { type: string }
        description: { type: string }
        contacts: { type: string }
    Attribute:
      type: object
      properties: { name: { type: string }, value: { type: string } }
    Image:
      type: object
      properties: { url: { type: string }, sort_order: { type: integer } }
    Product:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        category_id: { type: integer, nullable: true }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        stock: { type: integer }
        status: { type: string, enum: [pending, published, rejected] }
        is_hidden: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        images: { type: array, items: { $ref: '#/components/schemas/Image' } }
        attributes: { type: array, items: { $ref: '#/components/schemas/Attribute' } }
    ProductInput:
      type: object
      description: При PATCH передавайте только изменяемые поля. images/attributes, если переданы, заменяют список целиком (до 5 фото).
      properties:
        category_id: { type: integer, nullable: true }
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        images: { type: array, maxItems: 5, items: { type: string } }
        attributes: { type: array, items: { $ref: '#/components/schemas/Attribute' } }
    OrderItem:
      type: object
      properties:
        product_id: { type: integer }
        product_name: { type: string }
        quantity: { type: integer }
        unit_price: { type: number }
    Order:
      type: object
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        number: { type: string }
        customer_name: { type: string }
        customer_phone: { type: string }
        customer_email: { type: string }
        delivery_address: { type: string }
        total_amount: { type: number }
        status: { type: string, enum: [new, assembling, shipped, delivered, cancelled] }
        payment_status: { type: string, enum: [unpaid, paid, failed] }
        created_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        history:
          type: array
          items:
            type: object
            properties: { status: { type: string }, changed_at: { type: string, format: date-time } }
    CreateOrder:
      type: object
      required: [customer_name, customer_phone, customer_email, delivery_address, items]
      properties:
        customer_name: { type: string }
        customer_phone: { type: string }
        customer_email: { type: string }
        delivery_address: { type: string }
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties: { product_id: { type: integer }, quantity: { type: integer, minimum: 1 } }
    Analytics:
      type: object
      properties:
        days: { type: integer }
        revenue: { type: number }
        orders_count: { type: integer }
        avg_check: { type: number }
        low_stock_products: { type: integer }
        top_products:
          type: array
          items:
            type: object
            properties: { product_id: { type: integer }, name: { type: string }, sold: { type: integer }, revenue: { type: number } }
        by_day:
          type: array
          items:
            type: object
            properties: { date: { type: string }, orders: { type: integer }, revenue: { type: number } }
paths:
  /health:
    get:
      summary: Проверка сервера и БД
      responses: { '200': { description: ok } }
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация селлера
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string, minLength: 8 } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вход, выдача JWT (24 часа)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema: { type: object, properties: { token: { type: string }, user: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/shop:
    get:
      tags: [Shop]
      summary: Мой магазин (seller)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Shop' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Shop]
      summary: Создать магазин (один на селлера, статус pending до модерации)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShopInput' } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/Shop' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [Shop]
      summary: Изменить профиль магазина
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ShopInput' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Shop' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/seller/products:
    get:
      tags: [Seller products]
      summary: Товары моего магазина
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, published, rejected] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } }, limit: { type: integer }, offset: { type: integer } } }
    post:
      tags: [Seller products]
      summary: Создать товар (статус pending, уходит на модерацию)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seller/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Seller products]
      summary: Товар моего магазина
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Seller products]
      summary: Редактировать товар (частичное обновление)
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Seller products]
      summary: Удалить товар ("мягкое" удаление)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Удалён }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/seller/products/{id}/hide:
    post:
      tags: [Seller products]
      summary: Скрыть товар из каталога
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
  /api/seller/products/{id}/show:
    post:
      tags: [Seller products]
      summary: Снова показать товар в каталоге
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
  /api/seller/products/{id}/stock:
    patch:
      tags: [Seller products]
      summary: Изменить остаток (при 0 товар пропадает из каталога)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [stock], properties: { stock: { type: integer, minimum: 0 } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seller/orders:
    get:
      tags: [Seller orders]
      summary: Заказы моего магазина
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, assembling, shipped, delivered, cancelled] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Order' } } } }
  /api/seller/orders/{id}:
    get:
      tags: [Seller orders]
      summary: Заказ с позициями и историей статусов
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/seller/orders/{id}/status:
    patch:
      tags: [Seller orders]
      summary: "Сменить статус: new → assembling → shipped → delivered; cancelled из new/assembling (остатки возвращаются)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [assembling, shipped, delivered, cancelled] } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/seller/analytics:
    get:
      tags: [Seller orders]
      summary: Простая аналитика (выручка, заказы, средний чек, топ товаров, динамика по дням)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, maximum: 365 } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } }
  /api/ai/description:
    post:
      tags: [AI]
      summary: Сгенерировать описание товара
      description: Можно передать product_id (данные подтянутся из товара) или name/category_id/attributes вручную.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id: { type: integer }
                name: { type: string }
                category_id: { type: integer }
                attributes: { type: array, items: { $ref: '#/components/schemas/Attribute' } }
                keywords: { type: array, items: { type: string } }
                tone: { type: string, example: дружелюбный }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, properties: { description: { type: string }, provider: { type: string, description: 'mock = демо-режим' } } }
        '502': { description: Ошибка ИИ-провайдера }
  /api/ai/price:
    post:
      tags: [AI]
      summary: Подсказка цены по похожим товарам площадки
      description: Цифры считаются по БД (товары той же категории), ИИ только объясняет рекомендацию.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id: { type: integer }
                name: { type: string }
                category_id: { type: integer }
                description: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  similar_count: { type: integer }
                  min: { type: number }
                  avg: { type: number }
                  max: { type: number }
                  suggested_price: { type: number }
                  explanation: { type: string }
                  provider: { type: string }
  /api/catalog/products:
    get:
      tags: [Catalog]
      summary: Каталог для покупателя (только опубликованные, нескрытые, с остатком > 0)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Поиск по названию и описанию }
        - { name: category_id, in: query, schema: { type: integer }, description: Включая подкатегории }
        - { name: shop_id, in: query, schema: { type: integer } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [new, price_asc, price_desc] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/catalog/products/{id}:
    get:
      tags: [Catalog]
      summary: Карточка товара
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/catalog/categories:
    get:
      tags: [Catalog]
      summary: Дерево категорий (плоский список с parent_id)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { id: { type: integer }, name: { type: string }, parent_id: { type: integer, nullable: true } } }
  /api/catalog/shops/{id}:
    get:
      tags: [Catalog]
      summary: Страница магазина (только одобренные)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Shop' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders:
    post:
      tags: [Orders (buyer)]
      summary: Оформить заказ без аккаунта (корзина из нескольких магазинов делится на несколько заказов)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrder' } } }
      responses:
        '201':
          description: Созданы заказы
          content:
            application/json:
              schema: { type: object, properties: { orders: { type: array, items: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders/{number}:
    get:
      tags: [Orders (buyer)]
      summary: Статус заказа по номеру и email
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/{number}/pay:
    post:
      tags: [Orders (buyer)]
      summary: Тестовая оплата без реальных денег (simulate=failure имитирует отказ). Отключена, если заданы ключи CloudPayments
      parameters: [{ $ref: '#/components/parameters/Number' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string }, simulate: { type: string, enum: [success, failure], default: success } }
      responses:
        '200':
          description: Результат оплаты
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id: { type: integer }
                  amount: { type: number }
                  payment_status: { type: string, enum: [paid, failed] }
                  result: { type: string, enum: [success, failed] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/users:
    get:
      tags: [Admin]
      summary: Пользователи
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/moderation/shops:
    get:
      tags: [Admin]
      summary: Магазины по статусу (по умолчанию pending)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, default: pending } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Shop' } } } } }
  /api/admin/moderation/products:
    get:
      tags: [Admin]
      summary: Товары по статусу (по умолчанию pending)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, default: pending } }
      responses:
        '200': { description: ok }
  /api/admin/shops/{id}/moderate:
    post:
      tags: [Admin]
      summary: Решение по магазину
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved, rejected] }, reason: { type: string, description: Обязательна при rejected } } }
      responses:
        '200': { description: ok }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/products/{id}/moderate:
    post:
      tags: [Admin]
      summary: Решение по карточке товара
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [published, rejected] }, reason: { type: string, description: Обязательна при rejected } } }
      responses:
        '200': { description: ok }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/categories:
    post:
      tags: [Admin]
      summary: Создать категорию
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, parent_id: { type: integer, nullable: true } } }
      responses:
        '201': { description: Создана }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/orders/{number}/payment-intent:
    get:
      tags: [Orders (buyer)]
      summary: Параметры для платёжного виджета CloudPayments
      description: |
        Работает, только если на сервере заданы ключи CloudPayments (иначе 503).
        Сумму берёт из БД. Ответ передаётся в `new cp.CloudPayments().start(...)` как есть.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Параметры виджета
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicTerminalId: { type: string }
                  paymentSchema: { type: string, example: Single }
                  amount: { type: number }
                  currency: { type: string, example: RUB }
                  externalId: { type: string, description: Номер заказа }
                  description: { type: string }
                  receiptEmail: { type: string }
                  userInfo: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Онлайн-оплата не настроена }
  /api/payments/cloudpayments/check:
    post:
      tags: [Orders (buyer)]
      summary: "Webhook CloudPayments: Check (для CloudPayments, не для фронтенда)"
      description: Подпись проверяется по заголовку X-Content-HMAC. Ответ {"code":0} разрешает платёж.
      responses:
        '200': { description: 'code: 0 — ок, 10 — заказ не найден, 12 — неверная сумма, 13 — платёж не может быть принят' }
  /api/payments/cloudpayments/pay:
    post:
      tags: [Orders (buyer)]
      summary: "Webhook CloudPayments: Pay (платёж прошёл, заказ становится paid)"
      responses:
        '200': { description: 'code: 0' }
  /api/payments/cloudpayments/fail:
    post:
      tags: [Orders (buyer)]
      summary: "Webhook CloudPayments: Fail (платёж отклонён)"
      responses:
        '200': { description: 'code: 0' }
